<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Viewer & AI Chat</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include html2canvas library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- URL Input Section -->
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="Enter website URL (e.g., https://example.com)">
            <button onclick="loadWebsite()">Show Website</button>
        </div>
        <div class="error-message" id="errorMsg">Please enter a valid URL starting with http:// or https://</div>
        <iframe id="urlFrame" title="Content Viewer"></iframe>
        <button onclick="convertToJPG()" style="margin-top: 20px;">Convert to JPG</button>
        <iframe id="urlFrame1" title="JPG Viewer"></iframe>

        <!-- Chat Section -->
        <div class="chat-container">
            <div class="ai-chat-box">
                <img src="ai.png" alt="" id="aiImage" width="10%">
                <div class="ai-chat-area">
                    Hello! How can I help you today?
                </div>
            </div>
        </div>
        <div class="prompt-area">
            <input type="text" id="prompt" placeholder="Message..." value="please show only correct answer with option (A,B,C,D) in red colour and explain of all mcq questions with question number.">
            <button id="image">
                <img src="img.svg" alt="">
            </button>
            <button id="submit">
                <img src="submit.svg" alt="">
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
